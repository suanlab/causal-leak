name: docker

# Build the reproducibility image whenever the Dockerfile or the lock file
# changes, and run the code gate and the cited numbers inside it.
on:
  push:
    paths:
      - Dockerfile
      - requirements-lock.txt
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the PyTorch wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: docker build -t causal-leak:dmkd .
      - name: Gate and cited numbers inside the image
        run: docker run --rm causal-leak:dmkd make verify numbers PAPER_DIR=__none__
